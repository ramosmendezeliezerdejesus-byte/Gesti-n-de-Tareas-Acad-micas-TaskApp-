<ion-header>
  <ion-toolbar>
    <ion-title>Nueva tarea</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Cerrar formulario" (click)="cancelar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <ion-item class="form-field" lines="none">
      <ion-input label="Título" labelPlacement="stacked" placeholder="Ej. Terminar el resumen"
        formControlName="titulo" maxlength="80" required></ion-input>
    </ion-item>
    <ion-note class="error-note" color="danger" *ngIf="form.controls.titulo.touched && form.controls.titulo.invalid">
      Escribe un título de al menos 5 caracteres.
    </ion-note>

    <ion-item class="form-field" lines="none">
      <ion-textarea label="Descripción" labelPlacement="stacked" placeholder="Añade algunos detalles (opcional)"
        formControlName="descripcion" autoGrow="true" maxlength="240"></ion-textarea>
    </ion-item>

    <ion-item class="form-field" lines="none">
      <ion-select label="Prioridad" labelPlacement="stacked" formControlName="prioridad" interface="popover">
        <ion-select-option value="Alta">Alta</ion-select-option>
        <ion-select-option value="Media">Media</ion-select-option>
        <ion-select-option value="Baja">Baja</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button class="save-button" type="submit" expand="block" shape="round">
      <ion-icon slot="start" name="checkmark-outline"></ion-icon>Guardar tarea
    </ion-button>
  </form>
</ion-content>
